services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luxury_watch_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Luxury Watch API"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:WxY4WWq3LXEbYPhQMml+CMtWv/65++QNKG5CjzLL/P0=
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: toko_jam_mewah
      DB_USERNAME: watch_user
      DB_PASSWORD: watch_secret_password
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor

  db:
    image: mysql:8.4
    container_name: luxury_watch_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: toko_jam_mewah
      MYSQL_USER: watch_user
      MYSQL_PASSWORD: watch_secret_password
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
